<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식판 스캐너 · 로그인</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Space+Grotesk:wght@600;700&display=swap');

  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --card: #ffffff;
    --border: #dde3f5;
    --green: #16a34a;
    --green-light: #dcfce7;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --blue: #2563eb;
    --blue-light: #dbeafe;
    --red: #dc2626;
    --red-light: #fee2e2;
    --text: #1e2640;
    --muted: #6b7280;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 16px rgba(37,99,235,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-wrap {
    width: 100%;
    max-width: 400px;
  }

  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon { font-size: 52px; display: block; margin-bottom: 8px; }
  .logo-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.5px;
  }
  .logo-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* 탭 */
  .tab-row {
    display: flex;
    background: var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 9px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--surface);
    color: var(--blue);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* 폼 카드 */
  .form-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 700; color: var(--text); }
  .form-input {
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--blue); background: #fff; }
  .form-hint { font-size: 11px; color: var(--muted); }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }
  .submit-btn:hover { background: #1d4ed8; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .error-msg {
    display: none;
    background: var(--red-light);
    border: 1px solid #fca5a5;
    color: var(--red);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .error-msg.visible { display: block; }

  .success-msg {
    display: none;
    background: var(--green-light);
    border: 1px solid #86efac;
    color: var(--green);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .success-msg.visible { display: block; }

  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="logo">
    <span class="logo-icon">🍱</span>
    <div class="logo-title">판식이</div>
    <div class="logo-sub">AI 영양 분석 · 잔반 제로 챌린지</div>
  </div>

  <div class="tab-row">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">로그인</button>
    <button class="tab" id="tabRegister" onclick="switchTab('register')">회원가입</button>
  </div>

  <div class="form-card">
    <!-- 로그인 -->
    <div class="panel active" id="panelLogin">
      <div class="error-msg" id="loginError"></div>
      <div class="form-group">
        <label class="form-label">아이디</label>
        <input class="form-input" id="loginUser" type="text" placeholder="아이디 입력" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" id="loginPw" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>
      <button class="submit-btn" id="loginBtn" onclick="doLogin()">🚀 로그인</button>
    </div>

    <!-- 회원가입 -->
    <div class="panel" id="panelRegister">
      <div class="error-msg" id="registerError"></div>
      <div class="success-msg" id="registerSuccess"></div>
      <div class="form-group">
        <label class="form-label">아이디</label>
        <input class="form-input" id="regUser" type="text" placeholder="2~20자 영문/숫자" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" id="regPw" type="password" placeholder="4자 이상" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">학급 <span style="color:var(--muted);font-weight:400">(선택)</span></label>
        <input class="form-input" id="regClass" type="text" placeholder="예: 3학년 2반">
        <span class="form-hint">랭킹 경쟁에 사용됩니다</span>
      </div>
      <button class="submit-btn" id="registerBtn" onclick="doRegister()">✅ 회원가입</button>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
  document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
}

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPw').value;
  err.classList.remove('visible');

  if (!username || !password) { err.textContent = '아이디와 비밀번호를 입력해주세요.'; err.classList.add('visible'); return; }

  btn.disabled = true; btn.textContent = '로그인 중...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.success) { window.location.href = '/'; }
    else { err.textContent = data.error; err.classList.add('visible'); }
  } catch { err.textContent = '서버 오류가 발생했습니다.'; err.classList.add('visible'); }
  btn.disabled = false; btn.textContent = '🚀 로그인';
}

async function doRegister() {
  const btn = document.getElementById('registerBtn');
  const err = document.getElementById('registerError');
  const suc = document.getElementById('registerSuccess');
  const username   = document.getElementById('regUser').value.trim();
  const password   = document.getElementById('regPw').value;
  const class_name = document.getElementById('regClass').value.trim();
  err.classList.remove('visible'); suc.classList.remove('visible');

  btn.disabled = true; btn.textContent = '가입 중...';
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, class_name })
    });
    const data = await res.json();
    if (data.success) {
      suc.textContent = '✅ 가입 완료! 로그인해주세요.'; suc.classList.add('visible');
      setTimeout(() => switchTab('login'), 1200);
    } else { err.textContent = data.error; err.classList.add('visible'); }
  } catch { err.textContent = '서버 오류가 발생했습니다.'; err.classList.add('visible'); }
  btn.disabled = false; btn.textContent = '✅ 회원가입';
}

// Enter 키 지원
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('panelLogin').classList.contains('active')) doLogin();
  else doRegister();
});

</script>
</body>
</html>
