<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판식이 · 랭킹</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Space+Grotesk:wght@600;700&display=swap');

  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --border: #dde3f5;
    --green: #16a34a;
    --green-light: #dcfce7;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --blue: #2563eb;
    --blue-light: #dbeafe;
    --red: #dc2626;
    --text: #1e2640;
    --muted: #6b7280;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 16px rgba(37,99,235,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── NAV ── */
  nav {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 8px rgba(37,99,235,0.06);
  }
  .nav-logo { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: var(--blue); }
  .nav-actions { display: flex; gap: 8px; align-items: center; }
  .nav-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .nav-btn:hover { border-color: var(--blue); color: var(--blue); }
  .nav-btn.primary { background: var(--blue); color: white; border-color: var(--blue); }
  .nav-btn.primary:hover { background: #1d4ed8; }

  main { width: 100%; max-width: 540px; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }

  /* ── 제목 ── */
  .page-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ── 탭 ── */
  .tab-row {
    display: flex;
    background: var(--border);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .tab {
    flex: 1;
    padding: 10px 8px;
    border: none;
    background: transparent;
    border-radius: 9px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--surface);
    color: var(--blue);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* ── 랭킹 카드 ── */
  .rank-list { display: flex; flex-direction: column; gap: 10px; }

  .rank-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow);
    transition: transform 0.15s;
  }
  .rank-card:hover { transform: translateY(-1px); }
  .rank-card.me { border-color: var(--blue); background: var(--blue-light); }
  .rank-card.gold   { border-color: #f59e0b; }
  .rank-card.silver { border-color: #94a3b8; }
  .rank-card.bronze { border-color: #b45309; }

  .rank-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    width: 36px;
    text-align: center;
    flex-shrink: 0;
    color: var(--muted);
  }
  .rank-num.gold   { color: #f59e0b; }
  .rank-num.silver { color: #94a3b8; }
  .rank-num.bronze { color: #b45309; }

  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .rank-score {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--green);
    flex-shrink: 0;
  }
  .rank-score-unit { font-size: 11px; color: var(--muted); font-weight: 400; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-icon { font-size: 40px; display: block; margin-bottom: 10px; }

  .loading-state { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; }

  /* ── 내 순위 배너 ── */
  .my-rank-banner {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: var(--radius);
    padding: 16px 20px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(37,99,235,0.25);
  }
  .my-rank-label { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
  .my-rank-val { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; }
  .my-rank-right { text-align: right; }

  .panel { display: none; }
  .panel.active { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">🍱 판식이</div>
  <div class="nav-actions">
    <span style="font-size:13px;color:var(--muted)">{{ username }}</span>
    <a href="/" class="nav-btn primary">📷 분석하기</a>
    <button class="nav-btn" onclick="doLogout()">로그아웃</button>
  </div>
</nav>

<main>
  <div>
    <div class="page-title">🏆 잔반 제로 랭킹</div>
    <div class="page-sub">잔반 점수 평균으로 순위가 결정돼요</div>
  </div>

  <!-- 내 순위 배너 -->
  <div class="my-rank-banner" id="myBanner">
    <div>
      <div class="my-rank-label">내 순위</div>
      <div class="my-rank-val" id="myRankNum">—</div>
    </div>
    <div class="my-rank-right">
      <div class="my-rank-label">평균 잔반 점수</div>
      <div class="my-rank-val" id="myAvgScore">—</div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tab-row">
    <button class="tab active" onclick="switchTab('today')">오늘</button>
    <button class="tab" onclick="switchTab('personal')">개인 전체</button>
    <button class="tab" onclick="switchTab('class')">학급별</button>
  </div>

  <!-- 오늘 랭킹 -->
  <div class="panel active" id="panelToday">
    <div class="loading-state">불러오는 중...</div>
  </div>

  <!-- 개인 전체 랭킹 -->
  <div class="panel" id="panelPersonal">
    <div class="loading-state">불러오는 중...</div>
  </div>

  <!-- 학급별 랭킹 -->
  <div class="panel" id="panelClass">
    <div class="loading-state">불러오는 중...</div>
  </div>
</main>

<script>
const ME = "{{ username }}";
let currentTab = 'today';
const loaded = {};

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['today','personal','class'][i] === tab);
  });
  document.querySelectorAll('.panel').forEach((p, i) => {
    p.classList.toggle('active', ['panelToday','panelPersonal','panelClass'][i] === 'panel' + tab.charAt(0).toUpperCase() + tab.slice(1));
  });
  // panel id mapping
  const map = { today: 'panelToday', personal: 'panelPersonal', class: 'panelClass' };
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(map[tab]).classList.add('active');

  if (!loaded[tab]) { loadRanking(tab); loaded[tab] = true; }
}

async function loadRanking(tab) {
  const panelMap = { today: 'panelToday', personal: 'panelPersonal', class: 'panelClass' };
  const panel = document.getElementById(panelMap[tab]);
  panel.innerHTML = '<div class="loading-state">🔄 불러오는 중...</div>';

  try {
    const endpointMap = { today: '/api/ranking/today', personal: '/api/ranking/personal', class: '/api/ranking/class' };
    const res = await fetch(endpointMap[tab]);
    const rows = await res.json();

    if (!rows.length) {
      panel.innerHTML = '<div class="empty-state"><span class="empty-icon">🍽️</span>아직 기록이 없어요.<br>식판을 찍고 첫 주인공이 되어보세요!</div>';
      return;
    }

    // 내 순위 업데이트 (개인 탭 기준)
    if (tab === 'personal') {
      const myIdx = rows.findIndex(r => r.username === ME);
      if (myIdx >= 0) {
        document.getElementById('myRankNum').textContent = (myIdx + 1) + '위';
        document.getElementById('myAvgScore').textContent = rows[myIdx].avg_score + '점';
      }
    }

    const html = rows.map((r, i) => {
      const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      const isMe = (r.username === ME || r.class_name === ME);

      if (tab === 'class') {
        return `<div class="rank-card ${rankClass}">
          <div class="rank-num ${rankClass}">${medal}</div>
          <div class="rank-info">
            <div class="rank-name">🏫 ${r.class_name}</div>
            <div class="rank-meta">참여 ${r.members}명 · 총 ${r.total_records}회 기록</div>
          </div>
          <div style="text-align:right">
            <div class="rank-score">${r.avg_score}<span class="rank-score-unit">점</span></div>
          </div>
        </div>`;
      } else if (tab === 'today') {
        return `<div class="rank-card ${rankClass} ${r.username===ME?'me':''}">
          <div class="rank-num ${rankClass}">${medal}</div>
          <div class="rank-info">
            <div class="rank-name">${r.username} ${r.username===ME?'<span style="color:var(--blue);font-size:11px">나</span>':''}</div>
            <div class="rank-meta">${r.class_name || '학급 미입력'} · ${r.dish}</div>
          </div>
          <div class="rank-score">${r.score}<span class="rank-score-unit">점</span></div>
        </div>`;
      } else {
        return `<div class="rank-card ${rankClass} ${r.username===ME?'me':''}">
          <div class="rank-num ${rankClass}">${medal}</div>
          <div class="rank-info">
            <div class="rank-name">${r.username} ${r.username===ME?'<span style="color:var(--blue);font-size:11px">나</span>':''}</div>
            <div class="rank-meta">${r.class_name || '학급 미입력'} · ${r.total}회 참여 · 완벽 ${r.perfect}회</div>
          </div>
          <div class="rank-score">${r.avg_score}<span class="rank-score-unit">점</span></div>
        </div>`;
      }
    }).join('');

    panel.innerHTML = `<div class="rank-list">${html}</div>`;
  } catch(e) {
    panel.innerHTML = '<div class="empty-state">❌ 불러오기 실패. 새로고침 해주세요.</div>';
  }
}

async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
}

// 초기 로드
loadRanking('today');
loaded['today'] = true;

// 개인 전체 랭킹도 미리 로드해 내 순위 배너 표시
fetch('/api/ranking/personal').then(r => r.json()).then(rows => {
  const myIdx = rows.findIndex(r => r.username === ME);
  if (myIdx >= 0) {
    document.getElementById('myRankNum').textContent = (myIdx + 1) + '위';
    document.getElementById('myAvgScore').textContent = rows[myIdx].avg_score + '점';
  } else {
    document.getElementById('myRankNum').textContent = '기록 없음';
    document.getElementById('myAvgScore').textContent = '—';
  }
});
</script>
</body>
</html>
